services:
  # Backend API Service
  - type: web
    name: amazon-global-exports
    env: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://amazon-global-exports-web.onrender.com

  # Frontend Static Site
  - type: web
    name: Amazon-Global-Exports-web
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://amazon-global-exports.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html